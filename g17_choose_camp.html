<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Act 16 — Choose the Right Camp</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#534AB7,#2D1B69);min-height:100vh;padding:16px;display:flex;flex-direction:column;align-items:center;color:#fff}h1{font-size:1.8rem;color:#FFD166;text-align:center;margin-bottom:4px}.sub{color:#c5bff5;font-size:.85rem;text-align:center;margin-bottom:12px}.camps-bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}.camp-badge{border-radius:8px;padding:6px 12px;font-size:.78rem;font-weight:700}.hud{display:flex;gap:16px;background:rgba(0,0,0,.3);border-radius:12px;padding:7px 18px;margin-bottom:12px}.hv{font-size:1.5rem;font-weight:700;color:#FFD166;text-align:center}.hl{font-size:.65rem;color:#c5bff5;text-transform:uppercase;text-align:center}.profile-card{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:16px;padding:20px 22px;max-width:600px;width:100%;margin-bottom:12px}.profile-name{font-size:1.2rem;font-weight:700;color:#FFD166;margin-bottom:10px}.profile-row{font-size:.88rem;line-height:1.8;color:#eee}.profile-row strong{color:#c5bff5}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:600px;width:100%;margin-bottom:10px}.choice{border-radius:10px;padding:11px 14px;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .15s;border:2px solid transparent;text-align:center}.choice:hover{transform:scale(1.03)}.choice.correct{outline:3px solid #2db450;background:rgba(45,180,80,.3)}.choice.wrong{outline:3px solid #c83232;background:rgba(200,50,50,.2)}.msg{min-height:34px;text-align:center;font-size:.9rem;font-weight:700;color:#FFD166;margin:6px 0;max-width:600px}.reason-box{background:rgba(255,255,255,.08);border-radius:10px;padding:10px 16px;max-width:600px;width:100%;font-size:.82rem;color:#c5bff5;line-height:1.6;margin-bottom:10px;min-height:40px}.btn{border:none;border-radius:10px;padding:10px 22px;font-size:.9rem;font-weight:700;cursor:pointer;background:#FFD166;color:#2D1B69}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center}.modal{background:#2D1B69;border:3px solid #FFD166;border-radius:20px;padding:36px;text-align:center;max-width:400px}.score-big{font-size:3rem;font-weight:700;color:#FFD166;margin:10px 0}</style></head><body>
<h1>🎯 Choose the Right Camp!</h1><p class="sub">Activity 16 — Read each camper profile and recommend the best camp!</p>
<div class="camps-bar">
  <span class="camp-badge" style="background:rgba(255,100,0,.25);color:#ffa070">🏕️ Adventure</span>
  <span class="camp-badge" style="background:rgba(255,150,200,.25);color:#ffb0d0">🎨 Arts</span>
  <span class="camp-badge" style="background:rgba(100,200,100,.25);color:#90ee90">⚽ Sports</span>
  <span class="camp-badge" style="background:rgba(100,200,255,.25);color:#90daff">🔬 Science</span>
  <span class="camp-badge" style="background:rgba(255,220,100,.25);color:#ffe080">🌐 Language</span>
  <span class="camp-badge" style="background:rgba(200,150,100,.25);color:#d4a070">🐴 Horseback</span>
</div>
<div class="hud"><div><div class="hv" id="score">0</div><div class="hl">Score</div></div><div><div class="hv" id="qn">1/6</div><div class="hl">Profile</div></div></div>
<div class="profile-card" id="profileCard">
  <div class="profile-name" id="profName"></div>
  <div class="profile-row" id="profDetails"></div>
</div>
<div class="choices" id="choices"></div>
<div class="msg" id="msg"></div>
<div class="reason-box" id="reasonBox"></div>
<div class="overlay" id="overlay"><div class="modal"><h2 style="color:#FFD166">Done!</h2><div class="score-big" id="fs"></div><p style="color:#c5bff5" id="fm"></p><button class="btn" style="margin-top:14px" onclick="init()">Play again</button></div></div>
<script>
const CAMPS=[
  {name:"🏕️ Adventure Camp",color:"rgba(255,100,0,.3)"},
  {name:"🎨 Arts Camp",color:"rgba(255,150,200,.3)"},
  {name:"⚽ Sports Camp",color:"rgba(100,200,100,.3)"},
  {name:"🔬 Science Camp",color:"rgba(100,200,255,.3)"},
  {name:"🌐 Language Camp",color:"rgba(255,220,100,.3)"},
  {name:"🐴 Horseback Camp",color:"rgba(200,150,100,.3)"},
];
const PROFILES=[
  {name:"Alex, age 11",details:"<strong>Likes:</strong> robots, computers, building things, math puzzles<br><strong>Dislikes:</strong> loud music, team sports<br><strong>Can:</strong> code a basic program, do science experiments",a:"🔬 Science Camp",reason:"Alex loves technology, coding, and experiments — Science Camp is the perfect match!"},
  {name:"Sofia, age 12",details:"<strong>Likes:</strong> horses, being outdoors, animals, countryside<br><strong>Dislikes:</strong> screens, crowded places<br><strong>Can:</strong> ride a bike, care for animals",a:"🐴 Horseback Camp",reason:"Sofia loves animals and the outdoors — Horseback Camp lets her care for horses all week!"},
  {name:"Jordan, age 11",details:"<strong>Likes:</strong> soccer, running, swimming, competition<br><strong>Dislikes:</strong> sitting still, art class<br><strong>Can:</strong> play 3 different sports, swim",a:"⚽ Sports Camp",reason:"Jordan is active, competitive, and loves sport — Sports Camp is the ideal choice!"},
  {name:"Léa, age 10",details:"<strong>Likes:</strong> painting, drawing, drama, music<br><strong>Dislikes:</strong> sports, competitive activities<br><strong>Can:</strong> sing, play piano, draw portraits",a:"🎨 Arts Camp",reason:"Léa is creative and artistic — Arts Camp gives her painting, drama, and music every day!"},
  {name:"Marco, age 12",details:"<strong>Likes:</strong> languages, meeting new people, travel, cultures<br><strong>Dislikes:</strong> staying home, repetitive routines<br><strong>Can:</strong> speak French, English, and some Spanish",a:"🌐 Language Camp",reason:"Marco loves languages and people — Language Camp is where he belongs!"},
  {name:"Emma, age 11",details:"<strong>Likes:</strong> rock climbing, kayaking, survival challenges, being in nature<br><strong>Dislikes:</strong> screens, sitting in classrooms<br><strong>Can:</strong> read a map, build a fire safely",a:"🏕️ Adventure Camp",reason:"Emma thrives outdoors with physical challenges — Adventure Camp is her dream!"},
];
let profiles=[],idx=0,score=0;
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function init(){profiles=shuffle([...PROFILES]);idx=0;score=0;document.getElementById('overlay').style.display='none';render()}
function render(){
  if(idx>=profiles.length){end();return}
  const p=profiles[idx];
  document.getElementById('qn').textContent=(idx+1)+'/'+profiles.length;
  document.getElementById('profName').textContent="Camper Profile: "+p.name;
  document.getElementById('profDetails').innerHTML=p.details;
  document.getElementById('msg').textContent='';
  document.getElementById('reasonBox').textContent='';
  const ch=document.getElementById('choices');ch.innerHTML='';
  shuffle([...CAMPS]).slice(0,4).map(c=>c.name).includes(p.a)?null:null;
  const opts=[...CAMPS].sort(()=>Math.random()-.5).slice(0,4);
  if(!opts.find(o=>o.name===p.a))opts[0]=CAMPS.find(c=>c.name===p.a);
  shuffle(opts).forEach(camp=>{
    const d=document.createElement('div');d.className='choice';d.textContent=camp.name;d.style.background=camp.color;
    d.onclick=()=>{
      document.querySelectorAll('.choice').forEach(c=>c.style.pointerEvents='none');
      if(camp.name===p.a){d.classList.add('correct');score+=10;document.getElementById('msg').textContent='✅ Correct!';}
      else{d.classList.add('wrong');document.querySelectorAll('.choice').forEach(c=>{if(c.textContent===p.a)c.classList.add('correct')});document.getElementById('msg').textContent='❌ Not quite!';}
      document.getElementById('reasonBox').textContent='💡 '+p.reason;
      document.getElementById('score').textContent=score;
      setTimeout(()=>{idx++;render()},2200);
    };ch.appendChild(d);
  });
}
function end(){document.getElementById('fs').textContent=score+' / '+(profiles.length*10);document.getElementById('fm').textContent=score>=50?"Perfect matchmaker! 🏆":"Review the camp types and try again! 💪";document.getElementById('overlay').style.display='flex'}
init();
</script></body></html>
