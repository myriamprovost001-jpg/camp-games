<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Act 8A — Backpack Builder</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1F3864,#0d2040);min-height:100vh;padding:16px;display:flex;flex-direction:column;align-items:center;color:#fff}h1{font-size:1.8rem;color:#FFD166;text-align:center;margin-bottom:4px}.sub{color:#a8d4f5;font-size:.85rem;text-align:center;margin-bottom:14px}.layout{display:flex;gap:14px;max-width:820px;width:100%;flex-wrap:wrap}.panel{flex:1;min-width:240px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:14px;padding:14px}.panel-title{color:#FFD166;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}.backpack{font-size:8rem;text-align:center;margin-bottom:10px;cursor:pointer}.items-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-height:320px;overflow-y:auto}.item-slot{background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.2);border-radius:8px;padding:8px;font-size:.8rem;text-align:center;min-height:50px;cursor:pointer;transition:all .15s}.item-slot:hover{border-color:#FFD166;background:rgba(255,209,102,.1)}.item-slot.filled{border-style:solid;border-color:rgba(45,180,80,.5);background:rgba(45,180,80,.1)}.item-slot .emoji{font-size:1.4rem}.item-slot .label{font-size:.7rem;color:#a8d4f5;margin-top:2px}.prompt{background:rgba(255,255,255,.08);border-radius:10px;padding:10px;margin-bottom:8px}.prompt-q{color:#FFD166;font-size:.82rem;font-weight:700;margin-bottom:6px}.prompt-input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:7px 10px;color:#fff;font-size:.85rem;resize:none;outline:none;font-family:inherit}.prompt-input:focus{border-color:#FFD166}.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}.btn{border:none;border-radius:10px;padding:9px 18px;font-size:.85rem;font-weight:700;cursor:pointer;transition:transform .1s}.btn:hover{transform:scale(1.04)}.btn-add{background:#2db450;color:#fff}.btn-clear{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2)}.item-bank{display:flex;flex-wrap:wrap;gap:6px}.ib-chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:5px 10px;font-size:.82rem;cursor:pointer;transition:all .15s}.ib-chip:hover{background:rgba(255,209,102,.2);border-color:#FFD166}.ib-chip.selected{background:#FFD166;color:#1F3864;font-weight:700}</style></head><body>
<h1>🎒 Backpack Builder</h1><p class="sub">Activity 8A — Fill your backpack with information about yourself!</p>
<div class="layout">
  <div class="panel">
    <div class="panel-title">Your backpack</div>
    <div class="backpack">🎒</div>
    <div class="items-grid" id="itemsGrid"></div>
  </div>
  <div class="panel">
    <div class="panel-title">Tell me about yourself</div>
    <div class="prompt"><div class="prompt-q">What is your name?</div><input class="prompt-input" id="nameInp" placeholder="My name is..."></div>
    <div class="prompt"><div class="prompt-q">What do you like to do?</div><textarea class="prompt-input" id="likesInp" rows="2" placeholder="I like to..."></textarea></div>
    <div class="prompt"><div class="prompt-q">What can you do well?</div><textarea class="prompt-input" id="canInp" rows="2" placeholder="I can..."></textarea></div>
    <div class="prompt"><div class="prompt-q">What is your favourite camp activity?</div><textarea class="prompt-input" id="favInp" rows="2" placeholder="My favourite activity is..."></textarea></div>
    <div class="prompt"><div class="prompt-q">What will you pack in your backpack?</div>
      <div class="item-bank" id="itemBank"></div>
    </div>
    <div class="btn-row"><button class="btn btn-add" onclick="fillBag()">Fill my backpack!</button><button class="btn btn-clear" onclick="clearAll()">Clear</button></div>
  </div>
</div>
<script>
const ITEMS=[
  {emoji:"📓",label:"Journal"},{emoji:"📷",label:"Camera"},{emoji:"🔦",label:"Flashlight"},
  {emoji:"🧴",label:"Sunscreen"},{emoji:"🦟",label:"Bug spray"},{emoji:"💊",label:"First aid"},
  {emoji:"🍫",label:"Snacks"},{emoji:"🗺️",label:"Map"},{emoji:"🧭",label:"Compass"},
  {emoji:"🧼",label:"Soap"},{emoji:"🎵",label:"Music"},{emoji:"📚",label:"Book"},
  {emoji:"🛌",label:"Sleeping bag"},{emoji:"⛺",label:"Tent"},{emoji:"🍶",label:"Water bottle"},
  {emoji:"👟",label:"Extra shoes"},{emoji:"🧢",label:"Hat"},{emoji:"🪥",label:"Toothbrush"},
];
let selected=new Set(),grid=[];
function buildGrid(){
  const g=document.getElementById('itemsGrid');g.innerHTML='';grid=[];
  for(let i=0;i<8;i++){
    const slot=document.createElement('div');slot.className='item-slot';
    slot.innerHTML='<div style="color:rgba(255,255,255,.2);font-size:.7rem">empty</div>';
    g.appendChild(slot);grid.push(slot);
  }
}
function buildBank(){
  const b=document.getElementById('itemBank');b.innerHTML='';
  ITEMS.forEach(item=>{
    const chip=document.createElement('div');chip.className='ib-chip';chip.textContent=item.emoji+' '+item.label;
    chip.onclick=()=>{chip.classList.toggle('selected');selected.has(item)?selected.delete(item):selected.add(item)};
    b.appendChild(chip);
  });
}
function fillBag(){
  const name=document.getElementById('nameInp').value;
  const likes=document.getElementById('likesInp').value;
  const can=document.getElementById('canInp').value;
  const fav=document.getElementById('favInp').value;
  const items=[...selected].slice(0,6);
  const allInfo=[
    name?{emoji:'👤',label:name}:null,
    likes?{emoji:'❤️',label:likes.slice(0,20)}:null,
    can?{emoji:'💪',label:can.slice(0,20)}:null,
    fav?{emoji:'⭐',label:fav.slice(0,20)}:null,
    ...items
  ].filter(Boolean).slice(0,8);
  allInfo.forEach((info,i)=>{
    if(grid[i]){grid[i].className='item-slot filled';grid[i].innerHTML='<div class="emoji">'+info.emoji+'</div><div class="label">'+info.label+'</div>';}
  });
}
function clearAll(){
  selected=new Set();buildGrid();buildBank();
  document.getElementById('nameInp').value='';
  document.getElementById('likesInp').value='';
  document.getElementById('canInp').value='';
  document.getElementById('favInp').value='';
}
buildGrid();buildBank();
</script></body></html>
