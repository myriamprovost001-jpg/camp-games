<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Act 12 — Pack Your Backpack!</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1F3864,#185FA5);min-height:100vh;padding:16px;display:flex;flex-direction:column;align-items:center;color:#fff}h1{font-size:1.8rem;color:#FFD166;text-align:center;margin-bottom:4px}.sub{color:#a8d4f5;font-size:.85rem;text-align:center;margin-bottom:12px}.rule-box{background:rgba(255,255,255,.1);border:1px solid rgba(255,209,102,.3);border-radius:10px;padding:10px 18px;max-width:660px;width:100%;margin-bottom:12px;font-size:.88rem;text-align:center;color:#FFD166;font-weight:700}.layout{display:flex;gap:12px;max-width:820px;width:100%;flex-wrap:wrap;margin-bottom:12px}.items-panel{flex:1;min-width:260px;background:rgba(255,255,255,.06);border-radius:12px;padding:12px}.panel-title{color:#FFD166;font-size:.75rem;font-weight:700;text-transform:uppercase;margin-bottom:8px}.items-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.item-tile{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:10px;padding:8px;text-align:center;cursor:pointer;transition:all .15s;position:relative}.item-tile:hover{background:rgba(255,255,255,.2)}.item-tile.selected{background:rgba(255,209,102,.2);border-color:#FFD166}.item-tile.selected::after{content:"✓";position:absolute;top:2px;right:5px;color:#FFD166;font-weight:700;font-size:.75rem}.item-tile .ie{font-size:1.6rem}.item-tile .il{font-size:.68rem;color:#a8d4f5;margin-top:2px}.bag-panel{flex:1;min-width:220px;background:rgba(255,255,255,.06);border-radius:12px;padding:12px}.bag-visual{font-size:6rem;text-align:center;margin-bottom:8px}.bag-slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}.bag-slot{background:rgba(0,0,0,.2);border:1px dashed rgba(255,255,255,.2);border-radius:8px;padding:8px;text-align:center;min-height:54px;font-size:.75rem;color:rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center;justify-content:center}.bag-slot.filled{border-style:solid;border-color:rgba(255,209,102,.4);background:rgba(255,209,102,.08);color:#FFD166}.bag-slot .se{font-size:1.3rem}.counter{background:rgba(0,0,0,.3);border-radius:8px;padding:6px 12px;text-align:center;font-size:.88rem;color:#FFD166;font-weight:700;margin-bottom:8px}.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.btn{border:none;border-radius:10px;padding:9px 18px;font-size:.85rem;font-weight:700;cursor:pointer;transition:transform .1s}.btn:hover{transform:scale(1.04)}.btn-pack{background:#FFD166;color:#1F3864}.btn-clear{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}.sentence-area{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;max-width:660px;width:100%}.sa-title{color:#FFD166;font-size:.78rem;font-weight:700;margin-bottom:8px}.sa-input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:8px;color:#fff;font-size:.85rem;margin-bottom:6px;outline:none;font-family:inherit}.sa-input:focus{border-color:#FFD166}</style></head><body>
<h1>🎒 Pack Your Backpack!</h1><p class="sub">Activity 12 — You are going to camp for 5 days. Choose exactly 10 items!</p>
<div class="rule-box">Choose 10 items → Pack your bag → Explain your choices!</div>
<div class="layout">
  <div class="items-panel">
    <div class="panel-title">Available items (click to select)</div>
    <div class="items-grid" id="itemsGrid"></div>
  </div>
  <div class="bag-panel">
    <div class="panel-title">Your backpack</div>
    <div class="bag-visual">🎒</div>
    <div class="counter" id="counter">0 / 10 items selected</div>
    <div class="bag-slots" id="bagSlots"></div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn btn-pack" onclick="packBag()">Pack it!</button>
      <button class="btn btn-clear" onclick="clearAll()">Clear</button>
    </div>
  </div>
</div>
<div class="sentence-area">
  <div class="sa-title">✍️ Explain your choices — complete these sentences:</div>
  <input class="sa-input" placeholder="I chose ___ because ___">
  <input class="sa-input" placeholder="I chose ___ because ___">
  <input class="sa-input" placeholder="I didn't bring ___ because ___">
  <input class="sa-input" placeholder="I didn't bring ___ because ___">
</div>
<script>
const ITEMS=[
  {e:"🛌",l:"Sleeping bag"},{e:"⛺",l:"Tent"},{e:"🔦",l:"Flashlight"},{e:"🧭",l:"Compass"},{e:"🍶",l:"Water bottle"},
  {e:"🧴",l:"Sunscreen"},{e:"🦟",l:"Bug spray"},{e:"🦺",l:"Life jacket"},{e:"🏥",l:"First aid kit"},{e:"🧥",l:"Rain poncho"},
  {e:"🧦",l:"Extra socks"},{e:"👟",l:"Hiking boots"},{e:"🧢",l:"Baseball cap"},{e:"🍬",l:"Candy"},{e:"📓",l:"Journal"},
  {e:"📷",l:"Camera"},{e:"📚",l:"Book"},{e:"🍿",l:"Snacks"},{e:"🪢",l:"Rope"},{e:"🗺️",l:"Map"},
  {e:"🪥",l:"Toothbrush"},{e:"🧼",l:"Soap"},{e:"🏖️",l:"Towel"},{e:"🔥",l:"Matches"},{e:"📯",l:"Whistle"},
];
let selected=new Set();
function build(){
  const g=document.getElementById('itemsGrid');g.innerHTML='';
  ITEMS.forEach((item,i)=>{
    const d=document.createElement('div');d.className='item-tile'+(selected.has(i)?' selected':'');
    d.innerHTML='<div class="ie">'+item.e+'</div><div class="il">'+item.l+'</div>';
    d.onclick=()=>{
      if(selected.has(i)){selected.delete(i);}
      else if(selected.size<10){selected.add(i);}
      else{alert('You can only choose 10 items!');return;}
      build();updateSlots();
    };
    g.appendChild(d);
  });
  document.getElementById('counter').textContent=selected.size+' / 10 items selected';
}
function updateSlots(){
  const slots=document.getElementById('bagSlots');slots.innerHTML='';
  const sel=[...selected].map(i=>ITEMS[i]);
  for(let i=0;i<10;i++){
    const d=document.createElement('div');
    if(sel[i]){d.className='bag-slot filled';d.innerHTML='<div class="se">'+sel[i].e+'</div><div>'+sel[i].l+'</div>';}
    else{d.className='bag-slot';d.textContent=(i+1);}
    slots.appendChild(d);
  }
}
function packBag(){if(selected.size<10){alert('Pick exactly 10 items first!');return;}updateSlots();}
function clearAll(){selected=new Set();build();updateSlots();}
build();for(let i=0;i<10;i++){const d=document.createElement('div');d.className='bag-slot';d.textContent=(i+1);document.getElementById('bagSlots').appendChild(d);}
</script></body></html>
